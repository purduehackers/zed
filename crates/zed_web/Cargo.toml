# ZS-TODO(b7): `repl` joins once its `jupyter-websocket-client` (tokio) and `runtimelib`
# (aws-lc-rs) edges are gated for wasm; today they pull forbidden crates into the closure.
search.workspace = true
settings_profile_selector.workspace = true
settings_ui.workspace = true
sidebar.workspace = true
snippet_provider.workspace = true
snippets_ui.workspace = true
svg_preview.workspace = true
tab_switcher.workspace = true
tabular_data_preview.workspace = true
tasks_ui.workspace = true
# `task::RevealStrategy` for the test hooks' direct `TerminalPanel::add_terminal_shell` call.
task.workspace = true
terminal.workspace = true
terminal_view.workspace = true
theme_selector.workspace = true
title_bar.workspace = true
toolchain_selector.workspace = true
vim.workspace = true
vim_mode_setting.workspace = true
web_search.workspace = true
web_search_providers.workspace = true
which_key.workspace = true

# `tests/*.rs` are `#![cfg(target_family = "wasm")]` browser tests (`wasm_bindgen_test`,
# `run_in_browser`), driven by `wasm-bindgen-test-runner` with `script/check-wasm`'s flags.
# Each `wasm-bindgen-test` 0.3.x requires exactly one `wasm-bindgen-test-shared` (=
# `wasm-bindgen`) version; 0.3.77 is the one for the 0.2.127 the lockfile and
# `script/build-web`'s CLI pin.
[target.'cfg(target_family = "wasm")'.dev-dependencies]
wasm-bindgen-test = "=0.3.77"

[package.metadata.cargo-shear]
ignored = ["web-time", "time", "util", "getrandom", "getrandom_02", "smol"]
