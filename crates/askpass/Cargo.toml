[package]
name = "askpass"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "GPL-3.0-or-later"

[lints]
workspace = true

[lib]
path = "src/askpass.rs"

[dependencies]
anyhow.workspace = true
futures.workspace = true
gpui.workspace = true
smol.workspace = true
log.workspace = true
util.workspace = true
zeroize.workspace = true

# The socket proxy and the askpass scripts do not exist in the browser (see
# `PasswordProxy` in askpass.rs).
[target.'cfg(not(target_family = "wasm"))'.dependencies]
net.workspace = true
tempfile.workspace = true

[target.'cfg(not(any(target_os = "windows", target_family = "wasm")))'.dependencies]
which.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
windows.workspace = true

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
