[package]
name = "migrator"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "GPL-3.0-or-later"

[lints]
workspace = true

[lib]
path = "src/migrator.rs"
doctest = false

[dependencies]
anyhow.workspace = true
collections.workspace = true
convert_case.workspace = true
log.workspace = true
streaming-iterator.workspace = true
tree-sitter-json.workspace = true
serde_json_lenient.workspace = true
serde_json.workspace = true
settings_content.workspace = true
settings_json = { workspace = true, features = ["editing"] }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
# `wasm` = wasmtime-backed `WasmStore` for extension grammars; the browser links grammars itself.
tree-sitter = { workspace = true, features = ["wasm"] }

[target.'cfg(target_family = "wasm")'.dependencies]
tree-sitter.workspace = true

[dev-dependencies]
indoc.workspace = true
pretty_assertions.workspace = true
unindent.workspace = true
