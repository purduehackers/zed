[package]
description = "Shared logic for communication between the Zed app and the zed.dev server"
edition.workspace = true
name = "rpc"
version = "0.1.0"
publish.workspace = true
license = "GPL-3.0-or-later"

[lints]
workspace = true

[lib]
path = "src/rpc.rs"
doctest = false

[features]
gpui = ["dep:gpui"]
test-support = ["collections/test-support", "gpui/test-support", "proto/test-support"]

[dependencies]
anyhow.workspace = true
async-tungstenite.workspace = true
base64.workspace = true
collections.workspace = true
futures.workspace = true
gpui = { workspace = true, optional = true }
parking_lot.workspace = true
proto.workspace = true
rand.workspace = true
rsa.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
strum.workspace = true
tracing = { version = "0.1.34", features = ["log"] }
util.workspace = true
web-time.workspace = true
zstd.workspace = true

# Browser closure: `rand` 0.9 and `rsa` (via `rand_core` 0.6) reach both getrandom lines, and
# getrandom only compiles for wasm32-unknown-unknown with its browser feature on. gpui declares
# the same for its own graph; these make `script/check-wasm -p rpc` resolve on its own.
[target.'cfg(target_family = "wasm")'.dependencies]
getrandom = { version = "0.3.4", features = ["wasm_js"] }
getrandom_02 = { package = "getrandom", version = "0.2", features = ["js"] }

[dev-dependencies]
collections = { workspace = true, features = ["test-support"] }
gpui = { workspace = true, features = ["test-support"] }
proto = { workspace = true, features = ["test-support"] }
zlog.workspace = true
